services:
  db:
    image: postgis/postgis:16-3.4
    container_name: trenmap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trenmap
      POSTGRES_PASSWORD: trenmap
      POSTGRES_DB: trenmap
    ports:
      - "5433:5432"
    volumes:
      - trenmap_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trenmap -d trenmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api-rust
      dockerfile: Dockerfile.dev
    container_name: trenmap-api
    ports:
      - "3000:3000"
    volumes:
      - ./api-rust:/app
      - cargo-target:/app/target
    environment:
      DATABASE_URL: postgresql://trenmap:trenmap@db:5432/trenmap
      PORT: "3000"
      HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: trenmap-web
    ports:
      - "5172:5172"
    volumes:
      - ./web:/app
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      CI: "true"
      API_URL: http://api:3000
      WATCHPACK_POLLING: "true"
    depends_on:
      - api

volumes:
  trenmap_pgdata:
  cargo-target:
  pnpm-store:
